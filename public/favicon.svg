  <rect class="hole" x="51.6" y="16" width="3.2" height="3.2" rx="0.4" />
  <rect class="hole" x="51.6" y="23.5" width="3.2" height="3.2" rx="0.4" />
  <rect class="hole" x="51.6" y="31" width="3.2" height="3.2" rx="0.4" />
  <rect class="hole" x="51.6" y="38.5" width="3.2" height="3.2" rx="0.4" />
  <rect class="accent" x="51.6" y="46" width="3.2" height="3.2" rx="0.4" />
