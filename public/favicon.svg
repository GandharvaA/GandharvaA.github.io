<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .bg { fill: #f6f1e7; }
    .ring { fill: none; stroke: #1d1b16; stroke-width: 2.4; }
    .dash { fill: none; stroke: #1d1b16; stroke-width: 1.4; stroke-dasharray: 2.5 3.5; opacity: .7; }
    .trk { fill: none; stroke: #b03f27; stroke-width: 2.6; stroke-linecap: round; }
    .hit { fill: #b03f27; }
    .t { font: 700 21px Georgia, 'Times New Roman', serif; fill: #1d1b16; letter-spacing: -1px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1828; }
      .ring, .dash { stroke: #b9e3f0; }
      .trk { stroke: #f2a27c; }
      .hit { fill: #f2a27c; }
      .t { fill: #e4ecf4; }
    }
  </style>
  <circle class="bg" cx="32" cy="32" r="31" />
  <circle class="ring" cx="32" cy="32" r="29" />
  <circle class="dash" cx="32" cy="32" r="23" />
  <path class="trk" d="M32 32 A 21 21 0 0 1 53.5 44" />
  <circle class="hit" cx="53.5" cy="44" r="2.8" />
  <text class="t" x="32" y="39.5" text-anchor="middle">GA</text>
</svg>
