<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .bg { fill: #f6f1e7; }
    .ring, .hole { fill: #1d1b16; }
    .ring { fill: none; stroke: #1d1b16; stroke-width: 1.6; }
    .gate { fill: none; stroke: #2b6a6e; stroke-width: 1.5; }
    .accent { fill: #b03f27; }
    .t { font: 650 15px Georgia, 'Times New Roman', serif; fill: #1d1b16; letter-spacing: -0.4px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1828; }
      .ring { stroke: #b9e3f0; }
      .hole { fill: #b9e3f0; }
      .gate { stroke: #f2a27c; }
      .accent { fill: #8fd6e8; }
      .t { fill: #e4ecf4; }
    }
  </style>
  <circle class="bg" cx="32" cy="32" r="32" />
