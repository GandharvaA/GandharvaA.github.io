# Skill groups. Each item: name, optional level (expert | advanced | working | basic),
# optional detail, and industry: true to feature it on the industry CV.
- id: data-ml-ai
  label: Data analysis, ML & AI
  items:
    - name: Statistical inference
      detail: maximum-likelihood & template fits, least squares, sideband methods
      level: expert
      industry: true
    - name: Uncertainty quantification
      detail: systematic variations, correlated averages
      level: advanced
      industry: true
    - name: Kinematic (constrained) fitting
      detail: vertex and multi-constraint fits
      level: advanced
      industry: true
    - name: Machine-learning classification
      detail: multiclass classifiers in ROOT TMVA
      level: working
      industry: true
    - name: Natural language processing & speech
      detail: real-time voice interpreter (CLAIRE bachelor's project)
      level: basic
      industry: false
    - name: AI-assisted development
      detail: large language models for building and automating pipelines
      level: advanced
      industry: true
    - name: Machine Learning for Physicists and Astronomers (PhD course, 7.5 hp)
      level: working
      industry: false # TODO verify: course completed?

