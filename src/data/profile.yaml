tagline: >-
  Experimental physicist at Stockholm University, studying how Λ hyperons
  interact and what that means for the interior of neutron stars.

heroStatement: >-
  PhD candidate in experimental nuclear and hadron physics. I study how two Λ
  hyperons interact. That double-strangeness force is one piece of the hyperon
  puzzle: how neutron stars remain as massive as the ones we observe if their
  cores contain strange particles.

# Factual overview for the home-page "What I do" section.
work:
  intro: >-
    The PhD is a measurement of double-Λ production with HADES and a simulation
    study of ΛΛ cusps for CBM, together with the detector work and the analysis
    that those projects need.
  items:
    - title: HADES ΛΛ measurement
      text: >-
        Main analysis of double-Λ production in proton-proton collisions with
        the HADES spectrometer at GSI: reconstruction, particle identification,
        likelihood fits, and systematic uncertainties.
    - title: CBM cusp simulations
      text: >-
        Feasibility studies for the CBM experiment at FAIR. An event generator
        and a detector-response model ask whether ΛΛ cusps can be resolved and
        whether scattering parameters can be extracted.
    - title: Detectors and analysis
      text: >-
        Detector shifts on HADES, timing and calibration, Monte Carlo simulation,
        and machine-learning classifiers in a staged analysis pipeline on the
        GSI computing cluster.
    - title: Teaching and leadership
      text: >-
        Teaching at Fysikum since 2021, and leadership of the Fysikum
        PhD Council (vice-chair, then chair).

availability: Completing my PhD in 2027 and open to industry R&D and data roles. # TODO verify: preferred wording / availability date

industrySummary: >-
  Experimental physicist (PhD candidate, Stockholm University) with five years of
  hands-on work on a large accelerator experiment at GSI/FAIR in Germany. Main
  analysis responsibility for a rare-process measurement: detector operation,
  calibration-aware particle identification, Monte Carlo simulation, statistical
  inference with full uncertainty treatment, and machine-learning classification.
  Applies modern AI tools (ML classifiers and AI coding assistants) on top of deep
  instrumental expertise to build reproducible, automated analysis pipelines on HPC
  clusters. Earlier industry experience in automotive radar algorithms (Robert Bosch)
  and electromagnetic engineering. Experienced leader in university governance.

academicSummary: >-
  PhD candidate in experimental nuclear and hadron physics at Stockholm University,
  studying hyperon–hyperon (ΛΛ) interactions with the HADES experiment at GSI and
  simulation-based feasibility studies for the CBM experiment within the QCD at FAIR
  programme.

bio:
  - >-
    I am an experimental physicist finishing a PhD at Stockholm University. The
    research asks how strange particles (hyperons) interact with each other, a
    question that matters for the interior of neutron stars. The work uses the
    HADES spectrometer at the GSI/FAIR accelerator centre in Darmstadt, Germany,
    and simulations for the CBM experiment at FAIR.
  - >-
    Day to day this is the whole chain of a measurement: detector shifts during
    beam time, timing and calibration, Monte Carlo simulation of the detector,
    separation of a rare signal from a large background with likelihood fits and
    machine-learning classifiers, and a full account of the uncertainties.
    Analysis pipelines on the GSI computing cluster are built with the help of
    AI coding assistants.
  - >-
    Before the PhD I trained as an electronics engineer, worked on automotive radar
    algorithms at Robert Bosch, and designed electric propulsion for the KTH Hyperloop
    team.
  - >-
    Alongside research I have chaired the Fysikum PhD Council, served as vice-chair of
    the university's Central Doctoral Student Council, and been responsible for the
    nuclear physics student laboratory.

