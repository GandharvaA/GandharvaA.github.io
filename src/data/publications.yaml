- id: hyp2025-proceedings
  type: proceedings
  authors: ["G. Appagere (PANDA@HADES)"]
  title: "Investigating Double-Strange Systems at FAIR: ΛΛ interactions and neutron star cores"
  venue: "JPS Conference Proceedings, 15th International Conference on Hypernuclear and Strange Particle Physics (HYP2025), Tokyo"
  year: 2026
  status: in-press # TODO verify: accepted vs in press; add DOI/volume when available
  doi: ""
  arxiv: ""
  url: ""
  selected: true
  abstract: >-
    We present a study of double-strangeness production in proton–proton collisions
    performed using the HADES experiment at GSI, Darmstadt. The presented analysis
    focuses on the inclusive reconstruction of the reaction pp→ΛΛK⁺K⁺, 240 MeV above
    the production threshold. The results may provide constraints on hyperon–hyperon
    interactions and serve as an essential baseline for future studies at FAIR. In
    particular, they motivate dedicated measurements with the CBM experiment at SIS100,
    where higher beam energies, higher luminosities and larger acceptance will enable
    precision studies of hyperon–hyperon final-state interactions. The analysis
    strategy, reconstruction performance, and current experimental status at HADES are
    discussed. In addition, simulation-based feasibility studies to determine cusp
    structures in the ΛΛ invariant-mass spectrum at CBM are outlined.

